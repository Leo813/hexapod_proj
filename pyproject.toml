[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hexapod-rl"
version = "0.1.0"
description = "Independent PyTorch learning components for the hexapod project"
requires-python = ">=3.8"
dependencies = ["torch>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]
